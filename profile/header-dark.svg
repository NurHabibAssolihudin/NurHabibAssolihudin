<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-labelledby="title description">
<title id="title">NurHabib Assolihudin — Systems &amp; Product Engineer</title>
<desc id="description">A sculptural flower of folded crimson and violet petals opens and turns slowly. Modular applications, backend services, and developer infrastructure.</desc>
<defs><g id="leaf"><path d="M0 14-55-48-42-121-12-153 27-97 30-35Z" fill="currentColor"/><path d="M-12-153 0-45 0 14-55-48-42-121Z" fill="#0D1117" opacity=".24"/><path d="M-12-153 0-45 30-35" stroke="#FFFFFF" stroke-opacity=".24" stroke-width="1.2"/></g></defs>
<style>
.flower{animation:turn 80s linear infinite}.bloom{animation:bloom 9s ease-in-out infinite}.inner{animation:unfold 9s ease-in-out infinite}.topic{opacity:0;animation:topic 18s ease-in-out infinite}.topic-2{animation-delay:6s}.topic-3{animation-delay:12s}
@keyframes turn{to{transform:rotate(360deg)}}@keyframes bloom{0%,100%{transform:scale(.94)}50%{transform:scale(1.03)}}@keyframes unfold{0%,100%{transform:rotate(18deg) scale(.61)}50%{transform:rotate(31deg) scale(.68)}}@keyframes topic{0%,2%{opacity:0}5%,29%{opacity:1}32%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.flower,.bloom,.inner,.topic{animation:none}.topic-1{opacity:1}}
</style>
<rect width="1280" height="400" fill="#0D1117"/>
<g font-family="Arial,Helvetica,sans-serif"><g fill="#EEEAF4" font-size="78" font-weight="750" letter-spacing="-4"><text x="62" y="128">NurHabib</text><text x="62" y="209">Assolihudin.</text></g><text x="66" y="265" fill="#B9ACCA" font-size="27">Systems &amp; Product Engineer</text><circle cx="73" cy="307" r="5" fill="#C4A0E9"/><g fill="#C4A0E9" font-size="24"><text class="topic topic-1" x="94" y="315">Modular applications</text><text class="topic topic-2" x="94" y="315">Backend services &amp; integration</text><text class="topic topic-3" x="94" y="315">Developer infrastructure</text></g></g>
